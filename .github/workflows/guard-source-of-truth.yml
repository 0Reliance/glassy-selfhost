name: Guard source of truth

# Everything in this repository except .github/workflows/ is copied in from Glassy's main
# source by a release job, which commits as actions@github.com. A commit by anyone else that
# touches those files would be erased by the next release, so it is refused here instead.
#
# To suggest a change, open an issue, or open a pull request as a way to show it: this check
# will mark it, and an accepted change is applied at the source.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Only the release job changes published files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refuse hand edits to published files
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = 'pull_request' ]; then
            RANGE="$PR_BASE..$HEAD_SHA"
          else
            case "$PUSH_BEFORE" in
              ''|0000000000000000000000000000000000000000) RANGE="$HEAD_SHA~1..$HEAD_SHA" ;;
              *) RANGE="$PUSH_BEFORE..$HEAD_SHA" ;;
            esac
          fi

          # Commits in this range, not by the release job, that touch anything outside
          # .github/workflows/.
          OFFENDERS=$(git log --no-merges --format='%H%x09%ae%x09%an' "$RANGE" -- . ':(exclude).github/workflows' \
            | awk -F'\t' '$2 != "actions@github.com"' || true)

          if [ -z "$OFFENDERS" ]; then
            echo "No hand edits to published files."
            exit 0
          fi

          echo "::error::These commits change files that are copied in from Glassy's main source. They would be erased by the next release."
          echo "$OFFENDERS" | while IFS=$'\t' read -r sha email name; do
            echo "  $sha  $name <$email>"
            git show --stat --format= "$sha" -- . ':(exclude).github/workflows' | sed 's/^/      /'
          done
          echo
          echo "To change one of these files, open an issue here. Accepted changes are made at the source and arrive with the next release."
          exit 1
