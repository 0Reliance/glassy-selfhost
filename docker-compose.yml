# Glassy — self-hosted (local machine). Obsidian + local services reachable.
# Copy .env.example to .env and fill in the required fields (membership email,
# pairing token, secrets). Clear members also set GLASSY_VERIFY_CLOUD_URL.
# Then `docker compose up -d`. See README.md for the full quick start.
#
# MAINTAINERS: This file is the source of truth. After any change, sync
# to github.com/0Reliance/glassy-selfhost — see MAINTAINING.md.
name: glassy-selfhost
services:
  glassy:
    # ⚠️ GLASSY_TAG must be a pinned version, NOT `latest`. The floating `latest`
    # tag is the HOSTED build: release-image.yml rebuilds it without the
    # self-host build-time flags (VITE_ENABLE_MCP_SERVER/KB_UI/AGENT_GATEWAY/
    # BYOK), so on `latest` the AI tools (MCP), Second Brain, Agent connections
    # and API keys (BYOK) settings are hidden and a "You are on the cloud"
    # banner appears on your own appliance. Versioned tags carry all flags.
    # See DEPLOYMENT_RUNBOOK.md "GHCR tag semantics".
    image: ghcr.io/0reliance/glassy-dash:${GLASSY_TAG:?set GLASSY_TAG to a released version, e.g. v2.40.2 — do NOT use latest (it is the hosted build and omits self-host features)}
    container_name: glassy
    restart: unless-stopped
    ports: ['${APP_PORT:-3000}:8080']
    env_file: [.env]
    environment:
      - NODE_ENV=production
      - DB_FILE=/app/data/notes.db
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY:?set API_KEY_ENCRYPTION_KEY}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # Membership gate: your Glassy account email (Clear or Pro).
      # The appliance verifies this against the cloud on first boot and
      # caches the result for 30 days. Required — container will not start
      # without a verified membership.
      - GLASSY_MEMBER_EMAIL=${GLASSY_MEMBER_EMAIL:?set GLASSY_MEMBER_EMAIL to your Glassy membership email}
      # Self-host pairing token (required). Generate one in your Glassy
      # account under Settings → Self-hosting and paste it here.
      #   • Public/Pro: https://app.glassy.fyi/#/settings?g=account&s=selfhost
      #   • Clear members: https://clear.glassy.fyi/#/settings?g=account&s=selfhost
      # Prevents anyone who merely knows your email from spinning up an
      # unlocked instance using your membership.
      - GLASSY_SELFHOST_TOKEN=${GLASSY_SELFHOST_TOKEN:?set GLASSY_SELFHOST_TOKEN — generate one in your Glassy account under Settings → Self-hosting}
      # Cloud verification URL. Defaults to the public SaaS (app.glassy.fyi).
      # Clear members must set this to https://clear.glassy.fyi so the
      # appliance verifies against the cloud where their account lives.
      - GLASSY_VERIFY_CLOUD_URL=${GLASSY_VERIFY_CLOUD_URL:-https://app.glassy.fyi}
      # Identity: activates single-user gating (no registration, no commerce,
      # owner auto-unlocked). Hardcoded here (not a ${VAR} substitution) so
      # it cannot be overridden via .env. Even if someone runs the public GHCR
      # image with `-e INSTANCE_ID=self_hosted`, they still cannot pass the
      # membership gate without a valid GLASSY_SELFHOST_TOKEN — the token
      # requirement is what protects the public image, not this env var.
      - INSTANCE_ID=self_hosted
      - INSTANCE_ACCESS_MODE_DEFAULT=private
      # Operational flags — safe to override in .env:
      - DEPLOYMENT_LOCALITY=${DEPLOYMENT_LOCALITY:-local}
      # ── Second Brain / MCP full stack ───────────────────────────────
      # All 6 flags must be on together for MCP to work end-to-end:
      # CORPUS_INDEXER generates embeddings, KB_QUERY mounts the search API,
      # MCP_SERVER mounts the /mcp endpoint, HYBRID_SEARCH enables BM25+vector
      # fusion, MCP_BRIDGE enables Companion token exchange, KB_UI shows the
      # knowledge base route in the sidebar. All default true on self-host.
      - ENABLE_CORPUS_INDEXER=${ENABLE_CORPUS_INDEXER:-true}
      - ENABLE_KB_QUERY=${ENABLE_KB_QUERY:-true}
      - ENABLE_MCP_SERVER=${ENABLE_MCP_SERVER:-true}
      - ENABLE_HYBRID_SEARCH=${ENABLE_HYBRID_SEARCH:-true}
      - ENABLE_MCP_BRIDGE=${ENABLE_MCP_BRIDGE:-true}
      - ENABLE_AGENT_GATEWAY=${ENABLE_AGENT_GATEWAY:-true}
      # ── Appliance-only capabilities ────────────────────────────────
      # These two are DEFAULT-OFF in code (server/config/featureFlags.js)
      # because on the cloud they are either a billing bypass or a hosted-only
      # product surface. On the appliance the operator owns the keys and the
      # hardware, so they default ON here. Do not remove them:
      #   ENABLE_BYOK            — without it the server returns 403
      #                            BYOK_DISABLED for every provider-key write
      #                            while the UI (baked VITE_ENABLE_BYOK=true in
      #                            versioned images) still shows the section.
      #   ENABLE_CALENDAR_AUTOMATION — without it event-triggered Agent Gateway
      #                            dispatch is silently skipped by the
      #                            scheduler (it is permanently OFF on the
      #                            hosted instances by product decision).
      - ENABLE_BYOK=${ENABLE_BYOK:-true}
      - ENABLE_CALENDAR_AUTOMATION=${ENABLE_CALENDAR_AUTOMATION:-true}
      # NOTE: no VAPID_* here. Web-push routes are deliberately never mounted on the
      # appliance (server/index.js: "/api/push/* returns 404") and the push settings
      # panel is hidden to match — so these three keys would be forwarded into a
      # container that has no code path that reads them. Same reasoning as the
      # ENABLE_BYOK note above: do not advertise a knob the appliance cannot use.
      # If web push is ever enabled on self-host, add them back together with the
      # route mount — see SELF_HOSTED_DEPLOYMENT.md §13.

      # Ollama on the HOST (not in a container). The code default is
      # http://localhost:11434/v1, which inside a container points at the
      # container itself and always fails ("TypeError: fetch failed") — so set
      # the host gateway explicitly, same as OBSIDIAN_HOST_OVERRIDE below.
      # `extra_hosts` (bottom of this file) makes host.docker.internal resolve.
      # Using the bundled Ollama sidecar overlay instead? It overrides this to
      # http://ollama:11434 — see docker-compose.ollama.yml.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Chat model. `env_file: [.env]` below already forwards OLLAMA_MODEL into the
      # container, so this explicit entry is for `docker inspect` visibility and a
      # sane default, NOT for reachability. Ollama tags are exact — `llama3.2` is
      # `llama3.2:latest`, which a homelab that pulled `llama3.2:3b` does NOT have,
      # and that 404 was the #35 symptom. Set the tag you actually have.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      # Embeddings use a SEPARATE model from chat. Left empty on purpose: the
      # provider then probes /api/tags once and auto-selects an embedding-capable
      # model you already have, so a stock appliance needs no configuration.
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-}
      - OBSIDIAN_HOST_OVERRIDE=${OBSIDIAN_HOST_OVERRIDE:-host.docker.internal}
      # Single-user appliance gains nothing from multi-worker and the
      # cluster-mode fork race during initializeDatabase() produces noisy
      # first-boot worker churn. Pin to 1 worker for deterministic seeding
      # and clean first-boot logs (see Round 3 beta critique).
      - CLUSTER_WORKERS=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes: ['glassy-data:/app/data']
volumes: { glassy-data: {} }
